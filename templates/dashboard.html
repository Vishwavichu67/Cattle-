<!DOCTYPE html>
<html>
<head>
<title>Smart Cattle Health Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #eef7f9;
    margin: 0;
}
.header {
    background: #00695c;
    color: white;
    padding: 15px 30px;
    font-size: 22px;
}
.container { padding: 30px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}
.value { font-size: 28px; font-weight: 600; }

.alert {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
}
.alert-green { background: #e8f5e9; color: #2e7d32; }
.alert-yellow { background: #fff8e1; color: #f9a825; }
.alert-red { background: #ffebee; color: #c62828; }

button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
    font-weight: 600;
}
.live { background: #1e88e5; color: white; }
.manual { background: #6a1b9a; color: white; }

#manualControls {
    display: none;
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

.footer {
    margin-top: 25px;
    text-align: center;
    font-size: 14px;
    color: #555;
}
</style>
</head>

<body>

<div class="header">
    🐄 Smart Cattle Health Monitoring
</div>

<div class="container">

<!-- STATUS CARDS -->
<div class="grid">
    <div class="card">🌡 Temperature<div class="value"><span id="temp">--</span> °C</div></div>
    <div class="card">❤️ Heart Rate<div class="value"><span id="hr">--</span> BPM</div></div>
    <div class="card">🐄 Movement<div class="value" id="motion">--</div></div>
    <div class="card">⏱ Update<div class="value" style="font-size:18px" id="time">--</div></div>
</div>

<!-- ALERT -->
<div id="alertBox" class="alert alert-green">STATUS: HEALTHY</div>
<div id="alertReason" style="text-align:center; margin-top:8px; font-size:14px">
    Reason: --
</div>

<!-- MODE BUTTONS -->
<div style="text-align:center; margin-top:15px">
    <button class="live" onclick="setMode('LIVE')">LIVE MODE</button>
    <button class="manual" onclick="setMode('MANUAL')">MANUAL MODE</button>
</div>

<!-- MANUAL CONTROLS -->
<div id="manualControls">
    <h3>Manual Simulation</h3>

    Temperature:
    <input type="range" min="35" max="42" step="0.1" id="mTemp" oninput="sendManual()"><br><br>

    Heart Rate:
    <input type="range" min="40" max="140" step="1" id="mHR" oninput="sendManual()"><br><br>

    Motion:
    <select id="mMotion" onchange="sendManual()">
        <option value="1">MOVING</option>
        <option value="0">NOT MOVING</option>
    </select>
</div>

<!-- CHARTS -->
<div class="card" style="margin-top:30px">
    <h3>📈 Live Sensor Trends</h3>
    <canvas id="tempChart" height="100"></canvas><br>
    <canvas id="hrChart" height="100"></canvas><br>
    <canvas id="motionChart" height="80"></canvas>
</div>

<!-- FOOTER -->
<div class="footer">
    <div>Mode: <b><span id="modeLabel">LIVE</span></b></div>
    <div><a href="/training">⚙️ Model Training</a></div>
</div>

</div>

<script>
function setMode(mode) {
    fetch("/set_mode/" + mode, {method: "POST"});
    document.getElementById("manualControls").style.display =
        mode === "MANUAL" ? "block" : "none";
}

function sendManual() {
    const t = document.getElementById("mTemp").value;
    const h = document.getElementById("mHR").value;
    const m = document.getElementById("mMotion").value;

    document.getElementById("temp").innerText = parseFloat(t).toFixed(1);
    document.getElementById("hr").innerText = parseInt(h);
    document.getElementById("motion").innerText = m == "1" ? "MOVING" : "NOT MOVING";

    fetch("/set_manual_values", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({temp: t, hr: h, motion: m})
    });
}

function updateUI(d) {
    document.getElementById("temp").innerText = d.temperature.toFixed(1);
    document.getElementById("hr").innerText = d.heart_rate.toFixed(0);
    document.getElementById("motion").innerText = d.motion == 1 ? "MOVING" : "NOT MOVING";
    document.getElementById("time").innerText = d.time;
    document.getElementById("modeLabel").innerText = d.mode;

    const box = document.getElementById("alertBox");
    box.innerText = "STATUS: " + d.alert;
    box.className = "alert";

    document.getElementById("alertReason").innerText = "Reason: " + d.reason;

    if (d.alert.includes("CRITICAL") || d.alert.includes("FEVER")) {
        box.classList.add("alert-red");
    } else if (d.alert.includes("NO MOVEMENT")) {
        box.classList.add("alert-yellow");
    } else {
        box.classList.add("alert-green");
    }
}

setInterval(() => {
    fetch("/data").then(r => r.json()).then(updateUI);
}, 3000);

// --------------------
// CHARTS
// --------------------
let tempChart, hrChart, motionChart;

function initCharts() {
    tempChart = new Chart(document.getElementById("tempChart"), {
        type: "line",
        data: { labels: [], datasets: [{ label: "Temperature (°C)", data: [], borderColor: "red", fill: false }] },
        options: { animation: false }
    });

    hrChart = new Chart(document.getElementById("hrChart"), {
        type: "line",
        data: { labels: [], datasets: [{ label: "Heart Rate (BPM)", data: [], borderColor: "blue", fill: false }] },
        options: { animation: false }
    });

    motionChart = new Chart(document.getElementById("motionChart"), {
        type: "line",
        data: { labels: [], datasets: [{ label: "Movement (0/1)", data: [], borderColor: "green", stepped: true, fill: false }] },
        options: { animation: false }
    });
}

function updateCharts() {
    fetch("/history")
        .then(r => r.json())
        .then(d => {
            tempChart.data.labels = d.time;
            tempChart.data.datasets[0].data = d.temperature;
            tempChart.update();

            hrChart.data.labels = d.time;
            hrChart.data.datasets[0].data = d.heart_rate;
            hrChart.update();

            motionChart.data.labels = d.time;
            motionChart.data.datasets[0].data = d.motion;
            motionChart.update();
        });
}

initCharts();
setInterval(updateCharts, 5000);
</script>

</body>
</html>
