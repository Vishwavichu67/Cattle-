<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Training Pipeline</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f5f7fa;
    padding: 30px;
}

h2 {
    color: #00695c;
}

.pipeline {
    max-width: 600px;
    margin-top: 30px;
}

.step {
    padding: 15px 20px;
    margin-bottom: 12px;
    border-radius: 10px;
    background: #e0e0e0;
    color: #555;
    font-weight: 500;
}

.step.active {
    background: #bbdefb;
    color: #0d47a1;
}

.step.done {
    background: #c8e6c9;
    color: #1b5e20;
}

button {
    padding: 12px 25px;
    background: #00695c;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #004d40;
}

.back {
    display: inline-block;
    margin-top: 25px;
    color: #00695c;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>

<body>

<h2>🧠 CNN Model Training Pipeline</h2>

<button onclick="startTraining()">▶ Start Training</button>

<div class="pipeline" id="pipeline"></div>

<a class="back" href="/">⬅ Back to Dashboard</a>

<script>
function startTraining() {
    const pipeline = document.getElementById("pipeline");
    pipeline.innerHTML = "";

    fetch("/retrain", { method: "POST" })
        .then(res => res.json())
        .then(data => {
            const steps = data.steps;
            let i = 0;

            function showStep() {
                if (i > 0) {
                    pipeline.children[i - 1].classList.remove("active");
                    pipeline.children[i - 1].classList.add("done");
                }
                if (i < steps.length) {
                    const div = document.createElement("div");
                    div.className = "step active";
                    div.innerText = steps[i];
                    pipeline.appendChild(div);
                    i++;
                    setTimeout(showStep, 900);
                }
            }
            showStep();
        });
}
</script>

</body>
</html>
